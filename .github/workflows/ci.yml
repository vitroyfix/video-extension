name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run type-check
      - run: npm run build

      - name: Upload extension build
        uses: actions/upload-artifact@v4
        with:
          name: media-bridge-extension-${{ github.sha }}
          path: dist/
          if-no-files-found: error
